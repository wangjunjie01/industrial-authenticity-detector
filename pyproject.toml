[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-authenticity-detector"
version = "0.1.0"
description = "Explainable AI-like writing-risk and industrial authenticity analysis for B2B content."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Industrial Authenticity Detector contributors"}]
keywords = ["industrial-content", "writing-quality", "b2b", "authenticity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
industrial-authenticity = "industrial_authenticity.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
industrial_authenticity = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
